<!DOCTYPE html>
<!-- ============================ 1. DOCUMENT STRUCTURE ============================ -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CinnaCloud</title>
<style>
/* ======================= 2. CSS VARIABLES & VISUAL SYSTEM ======================= */
:root{
  --sky:#A9D8F5; --pale:#DDF2FF; --bg:#FFF5F7; --card:#fff; --ink:#344054; --mut:#66788e;
  --pink:#F8C9D4; --ppink:#FFE6ED; --acc2:#c2527a;
  --lav:#EAE5FF; --blush:#FFF0F5; --line:#f0d8e3; --acc:#2f7fb5; --ok:#2e8b57; --okbg:#e3f6ea;
  --shadow:0 6px 22px rgba(200,130,170,.16); --r:20px;
}
*{box-sizing:border-box} html,body{margin:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--ppink),var(--pale) 48%,var(--bg)) fixed;min-height:100vh;overflow-x:hidden;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 .35em;line-height:1.2;font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem} p{margin:.35em 0}
.muted{color:var(--mut);font-size:.93rem}
button,input,textarea{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.6em 1.2em;min-height:46px;
  font-weight:600;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:var(--shadow)} .btn:active{transform:scale(.95)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:#b3261e} .btn.small{min-height:40px;padding:.35em .9em;font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .between{justify-content:space-between}

main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--pink) -10%,var(--ppink) 30%,#fff 58%,var(--pale));display:grid;gap:8px;justify-items:center;text-align:center;padding:22px 16px;position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.hero-art{width:min(240px,64vw);height:auto;max-height:220px;object-fit:contain;animation:bob 5s ease-in-out infinite}
.pill{display:inline-block;background:var(--ppink);border:1px solid var(--pink);border-radius:999px;padding:.2em .9em;font-size:.85rem;font-weight:600}
.actions{display:grid;gap:12px}
.action{display:flex;align-items:center;gap:12px;text-align:left;border-radius:var(--r);padding:16px;min-height:72px;
  border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:1.05rem;width:100%;transition:transform .15s}
.action:active{transform:scale(.97)} .action .ico{font-size:1.7rem}
.action.t{background:linear-gradient(135deg,var(--pale),#fff)} .action.m{background:linear-gradient(135deg,var(--ppink),#fff)}

/* Progress */
.bar{height:14px;background:var(--pale);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sky) 60%,var(--acc));border-radius:9px;transition:width .9s cubic-bezier(.3,.8,.3,1)}

/* Tasks */
.task{display:flex;gap:12px;align-items:flex-start;border-left:5px solid var(--sky);transition:background .4s,border-color .4s}
.task.done{background:var(--okbg);border-left-color:var(--ok)} .task.done h3{text-decoration:line-through;opacity:.7}
.check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--sky);background:#fff;font-size:1.3rem;color:transparent;transition:all .25s}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}
.task-body{flex:1;min-width:0;overflow-wrap:anywhere} .overdue{color:#b3261e;font-weight:600}

/* Scrapbook */
.scrap{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;border-radius:var(--r);padding:12px;border:1px solid var(--line);background-color:var(--ppink);position:relative;margin-top:14px}
.scrap:before{content:"☁ ♥ ✦";position:absolute;top:-17px;right:16px;font-size:18px;letter-spacing:6px;color:var(--pink);text-shadow:0 0 4px #fff}
.scrap:after{content:"✧ ☁";position:absolute;bottom:-14px;left:18px;font-size:16px;letter-spacing:6px;color:var(--sky)}
.pols{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pol{background:#fff;border:0;padding:8px 8px 12px;text-align:left;border-radius:6px;box-shadow:var(--shadow);width:100%;position:relative;transition:transform .2s}
.pol:hover{transform:translateY(-3px) rotate(-.6deg)}
.pol:before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;transform:translateX(-50%) rotate(-3deg);background:rgba(248,201,212,.75);border-radius:2px}
.pol:nth-child(even):before{background:rgba(169,216,245,.75);transform:translateX(-50%) rotate(3deg)}
.pol .ph{aspect-ratio:1;background:var(--ppink);display:grid;place-items:center;overflow:hidden;font-size:2.2rem;border-radius:3px}
.pol img{width:100%;height:100%;object-fit:cover}
.cap{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;margin-top:8px;overflow-wrap:anywhere}
.star{position:absolute;top:2px;right:4px;font-size:1.3rem;color:#f2b632;text-shadow:0 0 6px #fff}
.big{max-width:100%;max-height:50vh;border-radius:10px;display:block;margin:8px auto}
.empty{text-align:center;padding:26px 10px}.empty svg,.empty img{width:140px;height:auto;animation:bob 5s ease-in-out infinite}

/* Forms & dialog */
.fm{display:grid;gap:6px}.fm label{font-weight:600;font-size:.93rem;margin-top:6px}
input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:.6em .8em;min-height:46px;background:#fff}
.fm .ck{display:flex;gap:10px;align-items:center}.fm .ck input{width:22px;height:22px}
.err{color:#b3261e;font-size:.92rem}
dialog{border:0;border-radius:var(--r);padding:20px;width:min(520px,94vw);max-height:88vh;background:#fff;color:var(--ink);box-shadow:0 12px 50px rgba(20,50,90,.35)}
dialog::backdrop{background:rgba(30,60,100,.4)} dialog[open]{animation:rise .3s ease}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:.7em 1.2em;border-radius:999px;z-index:50;max-width:90vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

/* Navigation: bottom bar on phones, sidebar on larger screens */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .brand{display:none}
nav button{flex:1;border:0;background:none;min-height:60px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--mut);transition:color .2s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav button[aria-current=page]{color:var(--acc2);box-shadow:inset 0 3px var(--pink)} nav button[aria-current=page] svg{transform:translateY(-2px) scale(1.12)}

/* ============================ 3. RESPONSIVE STYLES ============================ */
@media(min-width:768px){
  body{padding:0 0 0 210px}
  nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 12px;border-top:0;border-right:1px solid var(--line)}
  nav .brand{display:block;font-weight:800;font-size:1.25rem;color:var(--acc);margin:0 8px 14px}
  nav button{display:flex;flex:none;gap:10px;justify-content:flex-start;padding:.6em 1em;border-radius:14px;font-size:1rem;box-shadow:none!important}
  nav button[aria-current=page]{background:linear-gradient(90deg,var(--ppink),var(--pale))}
  .actions{grid-template-columns:1fr 1fr} .pols{grid-template-columns:repeat(3,1fr)} #toast{bottom:24px} main{padding:30px}
}

/* ============================ 4. ANIMATION DEFINITIONS ============================ */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}
.page>*{animation:rise .55s both;animation-delay:calc(var(--i,0)*70ms)}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;left:0;box-shadow:0 0 22px rgba(248,201,212,.7);background:#fff;border-radius:60px;opacity:.7;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:45%;height:150%;left:15%;top:-70%}.cloud:after{width:35%;height:120%;left:50%;top:-45%}
.spark:nth-child(3n){color:var(--pink)}
.spark{position:absolute;color:#fff;text-shadow:0 0 6px var(--pink);animation:twinkle ease-in-out infinite}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:20px;animation:fly 1.2s ease-out forwards}
/* Character illustrations */
.mini{width:56px;height:auto;flex:none}
.sway{animation:bob 4.5s ease-in-out infinite}
.peek{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:6px}
.peek .mini{animation:bob 6s ease-in-out infinite;animation-delay:-2s}
.peek p,.peek span{margin:0;max-width:34ch}
.side-note{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:center}
.side-note .btn{grid-column:2;justify-self:start}
.h1s{font-size:1.4rem;flex:1;min-width:0}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(2px)}
.hero:before{width:120px;height:46px;left:-34px;top:22px;animation:driftSlow 14s ease-in-out infinite alternate}
.hero:after{width:90px;height:38px;right:-24px;bottom:30px;animation:driftSlow 11s ease-in-out infinite alternate-reverse}
.cheer-pop{position:fixed;z-index:61;left:50%;top:40%;width:120px;height:auto;margin-left:-60px;pointer-events:none;animation:cheer 1.5s ease-out forwards}
/* Your supplied pictures: never stretched (object-fit), framed like little photos */
img.hero-art{width:min(320px,88vw);height:auto;max-height:190px;object-fit:contain;border-radius:22px;border:3px solid #fff;box-shadow:var(--shadow)}
img.mini-pic{width:100px;height:auto;object-fit:contain;border-radius:14px;border:2px solid #fff;box-shadow:var(--shadow);flex:none}
.side-note{grid-template-columns:100px 1fr}
.empty img{width:min(260px,74vw);height:auto;object-fit:contain;border-radius:18px;border:3px solid #fff;box-shadow:var(--shadow)}
img.cheer-pop{width:150px;margin-left:-75px;object-fit:contain;border-radius:18px;border:3px solid #fff;box-shadow:var(--shadow)}
@keyframes driftSlow{to{transform:translateX(28px)}}
@keyframes cheer{0%{transform:scale(.3) translateY(30px);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1) translateY(-10px);opacity:1}100%{transform:translateY(-40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.sky,.burst,.cheer-pop,.hero:before,.hero:after{display:none}}
</style><style id="nate-styles">
/* ===================== NATE 2. CSS (all ids/classes start with nate-) ===================== */
:root{--nate-w:clamp(88px,24vw,100px);--nate-toggle-bottom:calc(72px + env(safe-area-inset-bottom))}
@media(min-width:768px){:root{--nate-w:128px;--nate-toggle-bottom:18px}}
#nate-anchor{position:fixed;left:0;top:0;z-index:30;width:var(--nate-w);pointer-events:none;opacity:0;transition:opacity .4s;will-change:transform}
#nate-anchor[hidden]{display:none}
#nate-anchor.is-visible{opacity:1} #nate-anchor.is-visible.is-faded{opacity:.3}
#nate-bob{animation:nate-bob 3.2s ease-in-out infinite}
.nate-sprite{display:block;width:100%;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:12px}
#nate-anchor.is-faded .nate-sprite{pointer-events:none}
#nate-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;transition:transform .3s;filter:drop-shadow(0 5px 7px rgba(200,130,170,.35))}
.nate-sprite.is-walking{animation:nate-waddle .7s ease-in-out infinite}
.nate-sprite.nate-bounce{animation:nate-hop .6s ease}
.nate-sprite.nate-arrive{animation:nate-pop .55s ease}
#nate-bubble{position:fixed;left:0;top:0;z-index:40;max-width:min(240px,calc(100vw - 24px));width:max-content;padding:10px 14px;border-radius:18px;background:#fff;color:var(--ink);border:2px solid var(--pink);box-shadow:var(--shadow);font-size:.95rem;line-height:1.4;font-weight:600;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px) scale(.92);transform-origin:bottom center;transition:opacity .25s,transform .25s,visibility 0s .25s}
#nate-bubble.is-visible{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
#nate-bubble:after{content:"";position:absolute;left:var(--nate-arrow,50%);bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--pink);border-bottom:2px solid var(--pink);transform:translateX(-50%) rotate(45deg)}
#nate-bubble.is-below:after{bottom:auto;top:-9px;transform:translateX(-50%) rotate(225deg)}
#nate-bubble.is-side:after{display:none}
#nate-toggle{position:fixed;right:12px;bottom:var(--nate-toggle-bottom);z-index:45;min-height:44px;display:flex;align-items:center;gap:8px;padding:.4em 1em;border-radius:999px;border:1px solid var(--pink);background:rgba(255,255,255,.95);box-shadow:var(--shadow);font-weight:700;font-size:.9rem;color:var(--ink);cursor:pointer;transition:transform .15s}
#nate-toggle:active{transform:scale(.95)}
.nate-dot{width:8px;height:8px;border-radius:50%;background:#bbb}
#nate-toggle.is-roaming .nate-dot{background:#4cb782;animation:nate-blink 1.8s ease-in-out infinite}
#nate-panel{position:fixed;right:12px;bottom:calc(var(--nate-toggle-bottom) + 54px);z-index:45;width:min(240px,calc(100vw - 24px));padding:16px;border-radius:18px;background:#fff;border:1px solid var(--pink);box-shadow:0 10px 30px rgba(200,130,170,.3);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s,transform .2s,visibility 0s .2s}
#nate-panel.is-open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#nate-panel h2{font-size:1.1rem;margin:0}#nate-panel p{margin:2px 0 8px}
.nate-status{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;margin-bottom:10px}
.nate-panel-btn{display:block;width:100%;margin-top:8px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;transition:transform .15s}
.nate-panel-btn:active{transform:scale(.96)}.nate-panel-btn[hidden]{display:none}
#nate-call{background:var(--acc);border-color:var(--acc);color:#fff}#nate-pause{background:var(--ppink);border-color:var(--pink)}
@keyframes nate-bob{50%{transform:translateY(-5px)}}
@keyframes nate-waddle{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes nate-hop{30%{transform:translateY(-14px)}55%{transform:none}75%{transform:translateY(-5px)}}
@keyframes nate-pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1);opacity:1}}
@keyframes nate-blink{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){#nate-bob,.nate-sprite,#nate-toggle .nate-dot{animation:none!important}#nate-bubble,#nate-panel,#nate-img{transition:opacity .15s!important;transform:none!important}}
</style>
</head><body>
<div class="sky" id="sky" aria-hidden="true"></div>
<nav id="nav" aria-label="Main"></nav>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<!-- ===================== NATE 3. HTML MARKUP ===================== -->
<div id="nate-anchor" hidden>
  <div id="nate-bob"><button id="nate-sprite" class="nate-sprite" type="button" aria-label="Nate, your cheerleader. Tap for a little encouragement."><img id="nate-img" alt="" draggable="false"></button></div>
</div>
<div id="nate-bubble" role="status" aria-live="polite"></div>
<button id="nate-toggle" type="button" aria-expanded="false" aria-controls="nate-panel"><span class="nate-dot" aria-hidden="true"></span><span id="nate-toggle-label">☁ Nate</span></button>
<div id="nate-panel" role="dialog" aria-label="Nate, your little website cheerleader">
  <h2>Nate</h2><p class="muted">Your little website cheerleader.</p>
  <div class="nate-status" aria-live="polite"><span class="nate-dot" id="nate-status-dot" aria-hidden="true"></span><span id="nate-status">Roaming</span></div>
  <button id="nate-call" class="nate-panel-btn" type="button">Call Nate</button>
  <button id="nate-pause" class="nate-panel-btn" type="button">Pause</button>
  <button id="nate-hide" class="nate-panel-btn" type="button">Hide Nate</button>
  <p class="muted" style="margin-top:10px;font-size:.82rem">Need a little encouragement? Tap Nate!</p>
</div>

<script>
/* ============================ 5. APP CONFIGURATION (edit me!) ============================ */
const CONFIG = {
  recipient: "Faye",
  sender: "",                         // optional: add your name, or leave blank
  heading: "A Little Cloud Just for Faye ☁️",
  greeting: "Hi, Faye! Welcome to your little corner of the sky.",
  intro: "A little space for your thesis journey, the moments you love, and everything in between.",
  tagline: "Your thesis, your moments, your little sky.",
  dedication: "This little space was made especially for you. I hope it brings a little calm to your busy days and gives your happy moments somewhere to stay.",
  encouragements: [
    "One little step at a time, Faye.", "You don't have to finish everything today.",
    "Your progress matters, even when it's slow.", "There's more to you than your thesis.",
    "Little by little still gets you somewhere.", "Remember to leave a little room for yourself, too."
  ],
  celebrations: ["You did it, Faye!", "One less thing to worry about.", "Another little step forward!", "Cinnamoroll is cheering you on!"],
  // Your Cinnamoroll pictures (embedded so the file stays self-contained).

/* ============================ 6. DATA & STORAGE UTILITIES ============================ */
const STORE_KEY = "cc_state";                      // small data: localStorage
let state = { tasks: [], memories: [] };           // task: {id,title,chapter,due,notes,done,created}
                                                   // memory: {id,title,desc,date,win,hasPhoto}
function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!raw) return;
    // also upgrades data saved by the earlier, larger version of the site
    state.tasks = (raw.tasks || []).map(t => ({ ...t, done: t.done ?? t.status === "Completed" }));
    state.memories = (raw.memories || []).map(m => ({ ...m, win: m.win ?? m.cat === "Little Win", hasPhoto: m.hasPhoto ?? !!m.img }));
  } catch (e) { notify("Your saved data couldn't be read."); }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ tasks: state.tasks, memories: state.memories })); return true; }
  catch (e) { notify("Couldn't save. Your browser storage may be full or blocked."); return false; }
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Photos: IndexedDB (key = memory id, value = compressed JPEG data URL)
function openDb() {
  return new Promise((res, rej) => {
    const q = indexedDB.open("cinnacloud", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("img");
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function photoDb(method, ...args) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction("img", method === "get" ? "readonly" : "readwrite");
    const rq = tx.objectStore("img")[method](...args);
    tx.oncomplete = () => res(rq.result); tx.onerror = () => rej(tx.error);
  });
}
function showPhoto(id, imgEl) { photoDb("get", id).then(v => { if (v) imgEl.src = v; }).catch(() => {}); }
function compressPhoto(file) {
  return new Promise((res, rej) => {
    if (!/^image\/(png|jpe?g|gif|webp)$/.test(file.type)) return rej("Please choose a PNG, JPG, GIF or WebP photo.");
    if (file.size > 20e6) return rej("That photo is over 20 MB. Please pick a smaller one.");
    const fr = new FileReader();
    fr.onerror = () => rej("That file couldn't be read.");
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej("That photo couldn't be opened.");
      im.onload = () => {
        const k = Math.min(1, 1200 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================ 7. SHARED UI HELPERS ============================ */
const $ = s => document.querySelector(s);
// h("div",{class:"x",onclick:fn}, child, "text") builds elements safely (never uses innerHTML for user text)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat(9).forEach(c => c != null && c !== false && el.append(c.nodeType ? c : document.createTextNode(c)));
  return el;
}
const button = (label, onclick, cls = "") => h("button", { class: "btn " + cls, type: "button", onclick }, label);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const prettyDate = s => { const d = new Date(s + "T00:00"); return s && !isNaN(d) ? d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : ""; };
function dueText(s) {
  const n = Math.round((new Date(s + "T00:00") - new Date(todayStr() + "T00:00")) / 864e5);
  return n === 0 ? "Due today" : n === 1 ? "Due tomorrow" : n > 1 ? n + " days left" : "Overdue by " + (-n) + (n === -1 ? " day" : " days");
}
const isOverdue = t => t.due && !t.done && new Date(t.due + "T00:00") < new Date(todayStr() + "T00:00");
const pick = list => list[Math.floor(Math.random() * list.length)];

      b.classList.remove("is-below", "is-side"); let x = S.x + S.w / 2 - bw / 2, y = S.y - bh - 12;
      if (y < 8) { y = S.y + S.h + 12; b.classList.add("is-below"); }
      if (y + bh > vh - 8) { y = clamp(S.y, 8, vh - bh - 8); x = S.x + S.w + 10 + bw < vw - 8 ? S.x + S.w + 10 : S.x - bw - 10; b.classList.remove("is-below"); b.classList.add("is-side"); }
      x = clamp(x, 8, vw - bw - 8); b.style.left = x + "px"; b.style.top = y + "px"; b.style.setProperty("--nate-arrow", clamp(S.x + S.w / 2 - x, 20, bw - 20) + "px");
    }
    function showBubble(text) {
      el.bubble.textContent = text; placeBubble(); el.bubble.classList.add("is-visible"); S.bubbleOn = true; el.anchor.classList.remove("is-faded");
      const ms = cfg.bubbleBaseMs + text.length * cfg.bubblePerCharMs; clearTimeout(S.bubbleTimer); S.bubbleTimer = setTimeout(hideBubble, ms);
      S.hold = now() + ms + 900;   // Nate stands still while you read
    }
    function hideBubble() { clearTimeout(S.bubbleTimer); el.bubble.classList.remove("is-visible"); S.bubbleOn = false; fadeCheck(); }
    function onNateTap() { if (S.mode === "walking") stopWalk(); fx("nate-bounce"); showBubble(nextMessage()); syncLoop(); }

    /* ===================== NATE 6. PANEL CONTROLS ===================== */
    function updateUI() {
      const label = S.hidden ? "Hidden" : S.reduced ? "Staying put" : S.paused ? "Paused" : "Roaming";
      el.status.textContent = label; el.toggleLabel.textContent = S.hidden ? "☁ Show Nate" : "☁ Nate";
      el.toggle.classList.toggle("is-roaming", label === "Roaming"); el.dot.style.background = label === "Roaming" ? "#4cb782" : "#bbb";
      el.pause.textContent = S.paused ? "Resume roaming" : "Pause"; el.pause.hidden = S.reduced || S.hidden;
      el.call.textContent = S.hidden ? "Show Nate" : "Call Nate";
    }
    const panelOpen = () => el.panel.classList.contains("is-open");
    function openPanel() { el.panel.classList.add("is-open"); el.toggle.setAttribute("aria-expanded", "true"); setTimeout(() => el.call.focus(), 50); }
    function closePanel(refocus) { el.panel.classList.remove("is-open"); el.toggle.setAttribute("aria-expanded", "false"); if (refocus) el.toggle.focus(); }
    function showNate() {
      S.hidden = false; S.paused = false; el.anchor.hidden = false; measure();
      if (!S.placed) initialPlace(); else { const b = bounds(); S.x = clamp(S.x, b.left, b.right); S.y = clamp(S.y, b.top, b.bottom); applyPos(); requestAnimationFrame(() => el.anchor.classList.add("is-visible")); fx("nate-arrive"); }
      S.hold = now() + 1000; persist(); updateUI(); syncLoop(); fadeCheck();
    }
    function hideNate() {
      S.hidden = true; stopWalk(); hideBubble(); closePanel(false); el.anchor.classList.remove("is-visible"); el.anchor.hidden = true; persist(); updateUI(); syncLoop();
    }
    function callNate() {
      closePanel(false); if (S.hidden) showNate(); S.paused = false; persist(); updateUI(); hideBubble(); startWalk(chooseSpot(true), true); syncLoop();
    }
    function togglePause() {
      S.paused = !S.paused; if (S.paused) stopWalk(); else S.hold = now() + 600; persist(); updateUI(); syncLoop();
    }

    /* ===================== NATE 7. INITIALIZATION & CLEANUP ===================== */
    function initialPlace() {
      measure(); const spot = chooseSpot(false), b = bounds(); S.x = clamp(spot.x, b.left, b.right); S.y = clamp(spot.y, b.top, b.bottom); S.tx = S.x; S.ty = S.y;
      S.placed = true; applyPos(); requestAnimationFrame(() => { el.anchor.classList.add("is-visible"); fx("nate-arrive"); }); S.hold = now() + 1500; fadeCheck();
    }
    el.img.addEventListener("load", () => { measure(); if (!S.hidden && !S.placed) { el.anchor.hidden = false; initialPlace(); syncLoop(); } });
    el.img.src = cfg.image;
    el.sprite.addEventListener("click", e => { e.stopPropagation(); onNateTap(); });
    el.bubble.addEventListener("click", e => e.stopPropagation());
    el.toggle.addEventListener("click", () => { if (S.hidden) showNate(); else panelOpen() ? closePanel(false) : openPanel(); });
    el.call.addEventListener("click", () => (S.hidden ? showNate() : callNate()));
    el.pause.addEventListener("click", togglePause);
    el.hide.addEventListener("click", hideNate);
    const onDown = e => { if (panelOpen() && !el.panel.contains(e.target) && !el.toggle.contains(e.target)) closePanel(false); };
    const onKey = e => { if (e.key === "Escape") { if (panelOpen()) closePanel(true); else if (S.bubbleOn) hideBubble(); } };
    const onVis = () => syncLoop();
    let rt, ft = 0;
    const onResize = () => { clearTimeout(rt); rt = setTimeout(() => {
      if (S.hidden) return; measure(); const b = bounds();
      S.x = clamp(S.x, b.left, b.right); S.y = clamp(S.y, b.top, b.bottom); S.tx = clamp(S.tx, b.left, b.right); S.ty = clamp(S.ty, b.top, b.bottom);
      applyPos(); S.avoidAt = 0; if (S.bubbleOn) placeBubble(); fadeCheck(); }, 150); };
    const onScroll = () => { const t = now(); if (t - ft > 250 && !S.hidden) { ft = t; S.avoidAt = 0; fadeCheck(); } };
    const mq = matchMedia("(prefers-reduced-motion: reduce)");
    const onMotion = () => { S.reduced = mq.matches; if (S.reduced) stopWalk(); updateUI(); syncLoop(); };
    document.addEventListener("pointerdown", onDown); document.addEventListener("keydown", onKey); document.addEventListener("visibilitychange", onVis);
    addEventListener("resize", onResize); addEventListener("scroll", onScroll, { passive: true });
    mq.addEventListener ? mq.addEventListener("change", onMotion) : mq.addListener(onMotion);
    addEventListener("pagehide", () => { if (S.raf) cancelAnimationFrame(S.raf); S.raf = 0; clearTimeout(S.bubbleTimer); clearTimeout(rt); });
    if (S.hidden) el.anchor.hidden = true;
    updateUI();
    if (!S.hidden && !S.greeted) setTimeout(() => {   // a single hello the very first time
      if (!S.hidden && S.placed && !(el.dlg && el.dlg.open)) { S.greeted = true; persist(); showBubble(cfg.greeting); }
    }, 3000);
  } catch (err) { console.warn("Nate could not start, but CinnaCloud still works:", err); }
})();
</script>
</body></html>
